log_dir: default  # request logs go to .turbo-agent/<log_dir>/

backend:
  models:
    - name: openai-codex/gpt-5.6-luna
      executor: pi              # run through the Pi companion; your existing
                                # Pi login (auth.json) supplies credentials
      num_candidates: 4         # parallel candidate responses per request
      thinking: xhigh
      max_tokens: 65536

# Verifier selection is optional. When enabled, the judge must be an
# OpenAI-compatible endpoint exposing token logprobs (Gemini via Vertex,
# DeepSeek, OpenRouter, or any local vLLM/SGLang/llama.cpp server).
# Majority voting skips the tournament when a strict majority of candidates
# agree:
#
#   majority.mode: exact      raw string equality (default)
#   majority.mode: normalized case/punctuation/whitespace-insensitive
#   majority.mode: semantic   tool calls must still match exactly; prose may
#                             agree via embedding cosine >= threshold.
#                             Measured on octen-embed (4B, endurance):
#                             true paraphrases 0.84-0.93, near-miss bash
#                             commands 0.86-0.94 — which is why tool calls
#                             are never relaxed. Embedding failures degrade
#                             to normalized comparison.
#
# verifier:
#   model:
#     name: openai/<judge-model>
#     api_key: $OPENAI_API_KEY
#     # base_url: http://127.0.0.1:8097/v1   # for a local judge
#   majority_voting: true
#   majority:
#     mode: semantic
#     threshold: 0.92
#     embedding:
#       base_url: http://endurance:8090/v1
#       model: octen-embed
#   method:
#     name: pivot_tournament
#     pivots: 2                  # k: number of pivot (empirical-leader) candidates
#     n_verifications: 1         # K: repeated verifications per directed pair
#     seed: 0                    # seed for the random ring pass (reproducible)
#     note: >-
#       There is no reference solution available. Judge each trajectory purely on
#       how plausibly it solved the task correctly.
#     criteria:
#       - name: Task Success
#         description: >-
#           How likely the agent correctly and completely solved the task. The
#           strongest signal is the agent verifying its solution against the
#           task's specific requirements. Trajectory length, number of steps,
#           and apparent confidence do not predict correctness.

# context:                    # optional: rewrite/augment the prompt for clarity
